name: LedgerGym alternate-runner integration probe

on:
  pull_request:
    paths:
      - '.github/workflows/ci-bootstrap.yml'
      - 'ledgergym/**'
      - 'scripts/verify_integration.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-integration-probe:
    # Unlike the existing ubuntu-latest matrix, use one fixed image to
    # distinguish a globally blocked runner from an image-specific problem.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Confirm that a GitHub-hosted runner was assigned
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-role3-test.txt
      - name: Run focused offline regression plus mixed and causal datasets
        run: python scripts/verify_integration.py --mode focused --report /tmp/ledgergym-gate.json
      - name: Print the sanitized gate report
        if: always()
        run: |
          if test -f /tmp/ledgergym-gate.json; then
            cat /tmp/ledgergym-gate.json
          else
            echo "Integration script did not start; check earlier steps."
          fi
